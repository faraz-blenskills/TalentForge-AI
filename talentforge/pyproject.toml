[project]
name = "talentforge"
version = "0.1.0"
description = "TalentForge AI candidate portal"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

# Tells Vercel which ASGI app to serve (otherwise it may pick the older prototype in app/main.py).
[project.scripts]
app = "portal.main:app"

[tool.uv]
package = false          # an application, not a library: install dependencies only
